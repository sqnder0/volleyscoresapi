name: Live-site canary

# Runs the live suite (tests.py) against the real volleyscores.be daily, so
# a markup change on the site (the root cause behind both scraper bugs
# fixed in this session) is caught within a day instead of at the start of
# the next work session. A failed scheduled run shows up in the Actions tab
# and GitHub emails the repo owner by default - no extra notification setup
# needed.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

jobs:
  live-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live suite against volleyscores.be
        run: python -m unittest tests.py -v
